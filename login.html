{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <h2 style="text-align:center; margin-bottom:1.5rem;">Login</h2>
        <form method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.8rem;">Login</button>
        </form>
        <p style="text-align:center; margin-top:1.2rem; color:#64748b;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color:#2563eb; font-weight:600;">Register</a>
        </p>
        <div style="margin-top:1.5rem; padding:1rem; background:#f8fafc; border-radius:10px; font-size:0.9rem;">
            <strong>Demo Admin:</strong><br>
            Email: <code>admin@civic.ai</code><br>
            Password: <code>admin123</code>
        </div>
    </div>
</div>
{% endblock %}
