{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <h2 style="text-align:center; margin-bottom:1.5rem;">Create Account</h2>
        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.8rem;">Register</button>
        </form>
        <p style="text-align:center; margin-top:1.2rem; color:#64748b;">
            Already have an account? <a href="{{ url_for('login') }}" style="color:#2563eb; font-weight:600;">Login</a>
        </p>
    </div>
</div>
{% endblock %}
